# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy both services, or configure one service manually using the rootDir values below.

services:
  # Express API (MongoDB, auth, orders, etc.)
  - type: web
    name: women-centric-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  # Vite React static site
  - type: web
    name: women-centric-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
